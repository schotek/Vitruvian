# /run/vos: janus writes first-boot.conf here (0400) before forking
# vos-firstboot-commit. 0711, not 0700: users must be able to TRAVERSE the
# directory (finding #3) — both for the janus.ready wait in user mode and
# for the XDG_RUNTIME_DIR fallback below. Contents stay unlistable and the
# sensitive files carry their own 0400 modes.
d /run/vos 0711 root root -
# Parents of the per-user runtime-dir fallback (janus mkdir+chowns the
# 0700 /run/vos/user/<uid> leaf before dropping privileges). Only used
# when pam_systemd did not provide /run/user/<uid>.
d /run/vos/user 0755 root root -
