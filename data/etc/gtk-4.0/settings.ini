# System-wide GTK 4 defaults for X11 apps under Xvitruvian.
# The vendored BeOS theme (data/themes/BeOS) ships a gtk-4.0/ variant, so
# the same theme name works for GTK 3 and GTK 4.
# NOTE: GKeyFile only accepts '#' comments, never ';'.
[Settings]
gtk-theme-name = BeOS
gtk-font-name = Sans 10
# Hide client-side window buttons (BeOS decorations are server-side).
gtk-decoration-layout = :
