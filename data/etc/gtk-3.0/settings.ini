# System-wide GTK 3 defaults for X11 apps under Xvitruvian.
# The BeOS theme is vendored in data/themes/BeOS (-> /usr/share/themes/BeOS).
# GTK reads this file from the compiled-in sysconfdir (/etc/gtk-3.0) before
# any XDG_CONFIG_DIRS/HOME overrides, so per-user settings still win.
# NOTE: GKeyFile only accepts '#' comments — a ';' line makes the whole
# file unparseable (Gtk-WARNING "not a key-value pair, group, or comment").
[Settings]
gtk-theme-name = BeOS
gtk-font-name = Sans 10
# Under Vitrine every window carries BeOS server-side decorations — hide
# the client-side min/max/close buttons GTK would duplicate in headerbars
# (empty layout on both sides of the colon = no buttons at all).
gtk-decoration-layout = :
